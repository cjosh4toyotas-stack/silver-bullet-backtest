name: Update Silver Bullet backtest

on:
  schedule:
  - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sb-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet yfinance pandas

      - name: Fetch latest NQ bars from Yahoo Finance
        run: python fetch_yahoo.py

      - name: Merge data and re-run the backtest
        run: python update.py --new /tmp/yahoo_bars.csv --contract NQF-continuous

      - name: Commit and push if anything changed
        run: |
          git config user.name "sb-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update $(date -u +'%Y-%m-%d %H:%M') UTC (GitHub Actions)"
            git pull --rebase origin main || true
            git push origin main
          fi
