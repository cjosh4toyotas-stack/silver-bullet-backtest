name: Paper trading bot
# Runs the Silver Bullet paper bot in the cloud so no laptop is needed.
# GitHub's cron scheduler fires late or not at all on some days, so the
# schedule is self-healing: a firing every 30 minutes, and bot/block_gate.py
# in "auto" mode decides from the actual clock which block (if any) is
# running or starts within 90 minutes. The concurrency group serializes runs,
# so redundant firings queue and then SKIP in seconds; GitHub marking a
# superseded queued run "cancelled" is normal and harmless.
# Requires repo secrets IBKR_PAPER_USER and IBKR_PAPER_PASSWORD (paper login).

on:
  schedule:
    - cron: "15,45 4-20 * * 1-5"   # every 30 min through the trading day (UTC)
  push:
    paths:
      - "trigger/**"
  workflow_run:
    workflows: ["Update Silver Bullet backtest"]
    types: [completed] 
  workflow_dispatch:
    inputs:
      block:
        description: "Block to run"
        required: true
        type: choice
        options: [london, morning, afternoon]
      dry_run:
        description: "Signals only, no orders"
        type: boolean
        default: false
      login_test:
        description: "Only test the gateway login, no trading"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sb-paper-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - name: Gate (pick block, sleep until start, or skip)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARG="${{ inputs.block }}"
          else
            ARG=auto
          fi
          if [ "${{ inputs.login_test }}" = "true" ]; then
            echo "login test: bypassing gate"
            echo "block=$ARG" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT=$(python3 bot/block_gate.py "$ARG")
          echo "gate says:"
          echo "$OUT"
          BLOCK=$(echo "$OUT" | sed -n 's/^block=//p')
          VERDICT=$(echo "$OUT" | sed -n 2p)
          echo "block=$BLOCK" >> "$GITHUB_OUTPUT"
          if [ "$VERDICT" = "SKIP" ] || [ "$BLOCK" = "none" ] || [ -z "$BLOCK" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            sleep "$VERDICT"
          fi

      - name: Check secrets
        if: steps.gate.outputs.skip == 'false'
        run: |
          if [ -z "${{ secrets.IBKR_PAPER_USER }}" ] || [ -z "${{ secrets.IBKR_PAPER_PASSWORD }}" ]; then
            echo "::error::Missing IBKR_PAPER_USER / IBKR_PAPER_PASSWORD repo secrets"
            exit 1
          fi

      - name: Start IB Gateway (paper, headless)
        if: steps.gate.outputs.skip == 'false'
        run: |
          docker run -d --name ibgw \
            -p 127.0.0.1:4002:4004 \
            -e TWS_USERID='${{ secrets.IBKR_PAPER_USER }}' \
            -e TWS_PASSWORD='${{ secrets.IBKR_PAPER_PASSWORD }}' \
            -e TRADING_MODE=paper \
            -e READ_ONLY_API=no \
            -e EXISTING_SESSION_DETECTED_ACTION=primary \
            -e TWOFA_TIMEOUT_ACTION=restart \
            -e TIME_ZONE=America/New_York \
            ghcr.io/gnzsnz/ib-gateway:latest
          echo "Waiting for API port..."
          for i in $(seq 1 90); do
            if nc -z 127.0.0.1 4002; then echo "Gateway up"; exit 0; fi
            sleep 5
          done
          echo "::error::Gateway never opened the API port"; docker logs ibgw | tail -50; exit 1

      - name: Run bot
        id: runbot
        if: steps.gate.outputs.skip == 'false'
        continue-on-error: true
        run: |
          pip install -q ib_async
          if [ "${{ inputs.login_test }}" = "true" ]; then
          python3 - <<'PY'
          import sys, time
          from ib_async import IB
          ib = IB()
          for attempt in range(24):
              try:
                  ib.connect("127.0.0.1", 4002, clientId=9, timeout=15)
              except Exception as e:
                  print(f"attempt {attempt+1}/24: {e}", flush=True)
              if ib.isConnected():
                  print("LOGIN TEST PASSED - accounts:", ib.managedAccounts(), flush=True)
                  ib.disconnect()
                  sys.exit(0)
              time.sleep(10)
          print("LOGIN TEST FAILED - gateway API never came up", flush=True)
          sys.exit(1)
          PY
          else
          FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; fi
          SB_BLOCK="${{ steps.gate.outputs.block }}" python3 bot/sb_paper_bot.py $FLAG
          fi

      - name: Write connection status
        if: always() && steps.gate.outputs.skip == 'false'
        run: |
          CONN=false
          grep -q "Connected. Paper account" bot/sb_bot.log 2>/dev/null && CONN=true
          EQ=$(cat bot/sb_equity.txt 2>/dev/null || true)
          case "$EQ" in (''|*[!0-9.]*) EQ=null ;; esac
          mkdir -p data
          printf '{"utc":"%s","block":"%s","connected":%s,"outcome":"%s","run_id":"%s","equity":%s}' "$(date -u +%FT%TZ)" "${{ steps.gate.outputs.block }}" "$CONN" "${{ steps.runbot.outcome }}" "${{ github.run_id }}" "$EQ" > data/bot_status.json
          cat data/bot_status.json

      - name: Gateway diagnostics
        if: always() && steps.gate.outputs.skip == 'false'
        run: |
          echo "=== ibgw container logs (last 120 lines) ==="
          docker logs ibgw 2>&1 | tail -120 || true
          echo "=== IBC / gateway log files ==="
          docker exec ibgw sh -c 'for f in $(find /home/ibgateway -name "*.log" 2>/dev/null | head -4); do echo "--- $f"; tail -50 "$f"; done' || true
          echo "=== processes in container ==="
          docker exec ibgw ps aux 2>/dev/null | head -15 || true

      - name: Commit journal
        if: always() && steps.gate.outputs.skip == 'false'
        run: |
          if [ -f bot/sb_bot_journal.csv ]; then
            mkdir -p data
            touch data/bot_journal.csv
            head -1 bot/sb_bot_journal.csv > /tmp/j.csv
            tail -n +2 -q data/bot_journal.csv bot/sb_bot_journal.csv 2>/dev/null \
              | grep -v '^date,' | sort -u >> /tmp/j.csv || true
            cp /tmp/j.csv data/bot_journal.csv
          fi
          git config user.name "sb-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bot_journal.csv data/bot_status.json 2>/dev/null || true
          git diff --cached --quiet || {
            git commit -m "bot: status/journal update"
            git pull --rebase && git push
          }

      - name: Propagate bot result
        if: always() && steps.gate.outputs.skip == 'false' && steps.runbot.outcome == 'failure'
        run: exit 1

      - name: Upload log
        if: always() && steps.gate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: sb-bot-log-${{ github.run_id }}
          path: bot/sb_bot.log
          if-no-files-found: ignore

      - name: Stop gateway
        if: always() && steps.gate.outputs.skip == 'false'
        run: docker rm -f ibgw 2>/dev/null || true
