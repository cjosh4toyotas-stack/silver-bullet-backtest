<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silver Bullet — Live Charts</title>
<style>
  :root {
    color-scheme: dark;
    --surface-1: #1a1a19; --page: #0d0d0d;
    --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --pos: #3987e5; --neg: #e66767; --accent: #3987e5;
    --up: #4fa36c; --dn: #e66767;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: system-ui,-apple-system,"Segoe UI",sans-serif;
         background:var(--page); color:var(--ink-1); font-size:13px; min-height:100vh; }
  .topbar { display:flex; align-items:center; gap:16px; padding:0 14px; height:44px;
    background:var(--surface-1); border-bottom:1px solid var(--border); }
  .sym { font-weight:700; font-size:15px; letter-spacing:.3px; }
  .sym small { color:var(--ink-muted); font-weight:500; margin-left:6px; }
  .spacer { flex:1; }
  .updated { color:var(--ink-muted); font-size:11px; }
  a.navlink { color:var(--ink-2); text-decoration:none; font-size:12px;
    border:1px solid var(--border); border-radius:6px; padding:5px 10px; }
  a.navlink:hover { color:var(--ink-1); border-color:var(--ink-muted); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 14px 16px 60px; }
  #botline { display:none; border-radius:8px; padding:8px 12px; font-size:12px;
    font-weight:600; letter-spacing:.3px; margin-bottom:12px; }
  .panel { background:var(--surface-1); border:1px solid var(--border);
    border-radius:10px; padding:14px; margin-bottom:18px; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.6px;
    color:var(--ink-2); margin-bottom:10px; font-weight:600; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:10px; }
  .grp { display:inline-flex; gap:2px; background:var(--page); border:1px solid var(--border);
    border-radius:7px; padding:2px; }
  .tb { cursor:pointer; padding:4px 11px; border-radius:5px; color:var(--ink-muted);
    font-size:11.5px; font-weight:600; letter-spacing:.4px; user-select:none; }
  .tb.sel { background:var(--surface-1); color:var(--ink-1);
    box-shadow: inset 0 0 0 1px var(--border); }
  .tb:hover { color:var(--ink-1); }
  .lbl { color:var(--ink-muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; }
  #cwrap { position:relative; }
  #chart { width:100%; height:460px; display:block; }
  #tip { position:absolute; pointer-events:none; display:none; z-index:5;
    background:var(--page); border:1px solid var(--border); border-radius:6px;
    padding:6px 9px; font-size:11.5px; white-space:nowrap; line-height:1.55; }
  #tip .t { color:var(--ink-muted); }
  .legend { color:var(--ink-muted); font-size:11px; margin-top:8px; line-height:1.6; }
  .legend b { color:var(--ink-2); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th { text-align:left; color:var(--ink-muted); font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:.4px; padding:6px 8px;
    border-bottom:1px solid var(--baseline); }
  td { padding:6px 8px; border-bottom:1px solid var(--grid); font-size:12.5px; }
  tr.sig td { color:var(--ink-muted); }
  .num { text-align:right; } th.num { text-align:right; }
  .up { color:var(--up); } .dn { color:var(--dn); }
  .empty { color:var(--ink-2); padding:26px 10px; text-align:center; line-height:1.7; }
</style>
</head>
<body>
<div class="topbar">
  <span class="sym">SILVER BULLET CHARTS <small id="subtl">SPY · 5m</small></span>
  <span class="spacer"></span>
  <span class="updated" id="upd"></span>
  <a class="navlink" href="paper.html">← IBKR</a>
  <a class="navlink" href="index.html">TERMINAL</a>
  <a class="navlink" href="https://github.com/cjosh4toyotas-stack/silver-bullet-backtest/actions/workflows/paper_bot.yml" target="_blank" rel="noopener">RUNS</a>
</div>
<div class="wrap">
  <div id="botline"></div>
  <div class="panel">
    <div class="bar">
      <span class="lbl">Symbol</span>
      <span class="grp" id="symTabs"></span>
      <span class="lbl">Timeframe</span>
      <span class="grp" id="tfTabs"></span>
      <span class="lbl">Range</span>
      <span class="grp" id="rgTabs"></span>
    </div>
    <div id="cwrap">
      <canvas id="chart"></canvas>
      <div id="tip"></div>
    </div>
    <div class="legend">
      <b>Shaded columns</b> = this symbol's live trade windows (v4.1) &nbsp;·&nbsp;
      <b>▲ / ▼</b> = bot entry (long / short) &nbsp;·&nbsp;
      <b>●</b> = exit (<span class="up">green target</span> / <span class="dn">red stop</span> / grey time-out)
      &nbsp;·&nbsp; hover for OHLC &nbsp;·&nbsp; auto-refreshes every 60s
    </div>
  </div>
  <div class="panel">
    <h2 id="tradesTitle">Bot trades — SPY</h2>
    <div id="trades"></div>
  </div>
</div>
<script>
"use strict";
let SYM="SPY", TF=5, RANGE=5;              // timeframe minutes (1440 = 1D), range = NY days
const TFS=[[5,"5m"],[15,"15m"],[30,"30m"],[60,"1h"],[240,"4h"],[1440,"1D"]];
const RGS=[[1,"1D"],[3,"3D"],[5,"5D"],[10,"10D"],[9999,"ALL"]];
const WIN_SPY={"London 3-4a":[180,240],"Pre-market 8-9a":[480,540],
  "NYMEX open 9-10a":[540,600],"Late-morning 11a-12p":[660,720],
  "Midday 12-1p":[720,780],"Pre-settle 1:30-2:30p":[810,870]};
const WIN_QQQ={"Midday 12-1p":[720,780]};
const WINS=()=> SYM==="SPY" ? WIN_SPY : WIN_QQQ;
let BARS={}, ROWS=[], STATUS=null, VIEW=[], HIT=[];

const nyParts = t => new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",
  hour12:false, year:"numeric",month:"2-digit",day:"2-digit",
  hour:"2-digit",minute:"2-digit"}).formatToParts(t);
const nyMinutes = t => { const p=nyParts(t);
  return +p.find(x=>x.type==="hour").value%24*60 + +p.find(x=>x.type==="minute").value; };
const nyDate = t => new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York"}).format(t);

function parseBars(text){
  const lines=text.trim().split(/\r?\n/); const out=[];
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(",");
    if(c.length<5) continue;
    const t=new Date(c[0]);
    if(isNaN(t)) continue;
    out.push({t, o:+c[1], h:+c[2], l:+c[3], c:+c[4],
              d:nyDate(t), m:nyMinutes(t)});
  }
  return out;
}
function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  if(lines.length<2) return [];
  const H=lines[0].split(",");
  return lines.slice(1).map(ln=>{
    const c=ln.split(","); const o={};
    H.forEach((h,i)=>o[h]=c[i]===undefined?"":c[i]);
    o.R=parseFloat(o.r)||0; o.$=parseFloat(o.dollars)||0;
    return o;
  });
}

function aggregate(bars, tf){
  if(tf===5) return bars.map(b=>({...b, m2:b.m+5}));
  const out=[]; let cur=null, key=null;
  for(const b of bars){
    const k = tf===1440 ? b.d : b.d+"#"+Math.floor(b.m/tf);
    if(k!==key){
      if(cur) out.push(cur);
      key=k;
      cur={t:b.t, o:b.o, h:b.h, l:b.l, c:b.c, d:b.d,
           m: tf===1440 ? 570 : Math.floor(b.m/tf)*tf,
           m2: tf===1440 ? 960 : Math.floor(b.m/tf)*tf+tf};
    }else{
      cur.h=Math.max(cur.h,b.h); cur.l=Math.min(cur.l,b.l); cur.c=b.c;
    }
  }
  if(cur) out.push(cur);
  return out;
}

function setupCanvas(){
  const cv=document.getElementById("chart");
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  const g=cv.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);
  return {g,W,H};
}

function draw(){
  const {g,W,H}=setupCanvas();
  const tip=document.getElementById("tip"); tip.style.display="none";
  const all=BARS[SYM]||[];
  document.getElementById("subtl").textContent=SYM+" · "+TFS.find(x=>x[0]===TF)[1];
  if(!all.length){
    g.fillStyle="#c3c2b7"; g.font="13px system-ui"; g.textAlign="center";
    g.fillText("no bar data yet — the data updater publishes it through the day", W/2, H/2);
    VIEW=[]; return;
  }
  const days=[...new Set(all.map(b=>b.d))];
  const keep=new Set(days.slice(-RANGE));
  let bars=aggregate(all.filter(b=>keep.has(b.d)), TF);
  const PADL=8, PADR=56, PADT=10, PADB=26;
  const iw=W-PADL-PADR, ih=H-PADT-PADB;
  const n=bars.length; if(!n){ VIEW=[]; return; }
  const bw=iw/n;
  let lo=Infinity, hi=-Infinity;
  for(const b of bars){ if(b.l<lo)lo=b.l; if(b.h>hi)hi=b.h; }
  const pad=(hi-lo)*0.06||1; lo-=pad; hi+=pad;
  const X=i=>PADL+i*bw+bw/2, Y=v=>PADT+(hi-v)/(hi-lo)*ih;

  // window shading (only meaningful intraday)
  if(TF<1440){
    g.fillStyle="rgba(57,135,229,.07)";
    const wins=Object.values(WINS());
    let runStart=-1;
    for(let i=0;i<n;i++){
      const b=bars[i];
      const inWin=wins.some(([a,z])=> b.m<z && b.m2>a);
      if(inWin && runStart<0) runStart=i;
      if((!inWin||i===n-1) && runStart>=0){
        const end=(inWin&&i===n-1)?i+1:i;
        g.fillRect(PADL+runStart*bw, PADT, (end-runStart)*bw, ih);
        runStart=-1;
      }
    }
  }
  // grid + right axis
  g.strokeStyle="#2c2c2a"; g.fillStyle="#898781";
  g.font="10.5px system-ui"; g.textAlign="left"; g.lineWidth=1;
  for(let k=0;k<=4;k++){
    const v=lo+(hi-lo)*k/4, y=Y(v);
    g.beginPath(); g.moveTo(PADL,y); g.lineTo(W-PADR,y); g.stroke();
    g.fillText(v.toFixed(2), W-PADR+6, y+3.5);
  }
  // day separators + date labels
  g.textAlign="center";
  let lastD=null;
  for(let i=0;i<n;i++){
    if(bars[i].d!==lastD){
      lastD=bars[i].d;
      if(i>0){ g.strokeStyle="#383835";
        g.beginPath(); g.moveTo(PADL+i*bw,PADT); g.lineTo(PADL+i*bw,PADT+ih); g.stroke(); }
      const dt=new Date(bars[i].d+"T12:00:00Z");
      g.fillText(dt.toLocaleDateString([],{month:"short",day:"numeric"}),
                 Math.min(PADL+i*bw+34,W-PADR-20), H-8);
    }
  }
  // candles
  const cw=Math.max(1.5, Math.min(11, bw*0.62));
  for(let i=0;i<n;i++){
    const b=bars[i], up=b.c>=b.o, col=up?"#4fa36c":"#e66767";
    g.strokeStyle=col; g.fillStyle=col;
    g.beginPath(); g.moveTo(X(i),Y(b.h)); g.lineTo(X(i),Y(b.l)); g.stroke();
    const y1=Y(Math.max(b.o,b.c)), y2=Y(Math.min(b.o,b.c));
    g.fillRect(X(i)-cw/2, y1, cw, Math.max(1,y2-y1));
  }
  // trade markers
  HIT=[];
  const trades=ROWS.filter(r=>r.proxy===SYM && r.outcome && r.outcome!=="signal" && !(r.outcome||"").startsWith("skip") && r.exit && keep.has(r.date));
  for(const r of trades){
    const [a,z]=(SYM==="SPY"?WIN_SPY:WIN_QQQ)[r.window]||[0,1439];
    let ei=-1, xi=-1;
    for(let i=0;i<n;i++){
      const b=bars[i];
      if(b.d===r.date && b.m2>a && ei<0) ei=i;
      if(b.d===r.date && b.m<z+120) xi=i;   // exit can run past window (holds)
    }
    if(ei<0) continue;
    const long = r.bias==="bull";
    const ecol = long ? "#4fa36c" : "#e66767";
    const entry=parseFloat(r.entry), exit=parseFloat(r.exit);
    const ey=isFinite(entry)?Y(entry):Y(bars[ei].c);
    g.fillStyle=ecol;
    g.beginPath();
    if(long){ g.moveTo(X(ei),ey+11); g.lineTo(X(ei)-5,ey+19); g.lineTo(X(ei)+5,ey+19); }
    else    { g.moveTo(X(ei),ey-11); g.lineTo(X(ei)-5,ey-19); g.lineTo(X(ei)+5,ey-19); }
    g.closePath(); g.fill();
    if(xi>=0 && isFinite(exit)){
      const xy=Y(exit);
      const ocol = r.outcome==="target" ? "#4fa36c" : r.outcome==="stop" ? "#e66767" : "#898781";
      g.strokeStyle=ocol; g.setLineDash([3,3]);
      g.beginPath(); g.moveTo(X(ei),ey); g.lineTo(X(xi),xy); g.stroke(); g.setLineDash([]);
      g.fillStyle=ocol; g.beginPath(); g.arc(X(xi),xy,4,0,7); g.fill();
      HIT.push({x:X(xi),y:xy,r});
    }
    HIT.push({x:X(ei),y:ey,r});
  }
  VIEW=bars.map((b,i)=>({b, x:X(i)}));
}

function renderTrades(){
  const el=document.getElementById("trades");
  document.getElementById("tradesTitle").textContent="Bot trades — "+SYM;
  const rows=ROWS.filter(r=>r.proxy===SYM);
  if(!rows.length){ el.innerHTML='<div class="empty">No '+SYM+' trades yet.</div>'; return; }
  let h='<table><tr><th>Date</th><th>Window</th><th>Side</th><th class="num">Qty</th><th class="num">Entry</th><th class="num">Exit</th><th>Outcome</th><th class="num">R</th><th class="num">P&L</th></tr>';
  for(const r of [...rows].reverse()){
    const sig=r.outcome==="signal"||(r.outcome||"").startsWith("skip");
    const cls=r.$>0?"up":r.$<0?"dn":"";
    h+='<tr'+(sig?' class="sig"':'')+'><td>'+r.date+'</td><td>'+r.window+'</td><td>'+
       (r.bias==="bull"?"LONG":"SHORT")+'</td><td class="num">'+(r.qty||"—")+
       '</td><td class="num">'+(r.entry||"—")+'</td><td class="num">'+(r.exit||"—")+
       '</td><td>'+r.outcome+'</td><td class="num '+cls+'">'+(sig?"—":r.R.toFixed(2))+
       '</td><td class="num '+cls+'">'+(sig?"—":(r.$<0?"-":"+")+"$"+Math.abs(r.$).toFixed(0))+'</td></tr>';
  }
  el.innerHTML=h+'</table>';
}

function renderBotline(s){
  const el=document.getElementById("botline");
  if(!s){ el.style.display="none"; return; }
  el.style.display="block";
  const t=new Date(s.utc);
  const ageMin=(Date.now()-t.getTime())/60000;
  const when=t.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  const ago = ageMin<1.5 ? "just now" : ageMin<90 ? Math.round(ageMin)+" min ago"
            : (ageMin/60).toFixed(1)+" h ago";
  const red=()=>{ el.style.background="rgba(230,103,103,.14)"; el.style.color="var(--neg)"; };
  const amber=()=>{ el.style.background="rgba(240,185,80,.12)"; el.style.color="#e0aa3e"; };
  const green=()=>{ el.style.background="rgba(57,135,229,.10)"; el.style.color="var(--pos)"; };
  if(s.outcome==="running"){
    const st=s.starts?new Date(s.starts):null;
    if(ageMin>420){ red();
      el.textContent="⚠ PROBLEM · run launched "+when+" ("+ago+") and never reported a result · block: "+s.block;
    }else if(st && st.getTime()>Date.now()){ amber();
      el.textContent="◐ BOT LAUNCHED · waiting for block “"+s.block+"” · trading starts "+st.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+" · launched "+ago;
    }else{ amber();
      el.textContent="◐ BOT RUNNING NOW · block: "+s.block+" · since "+when+" ("+ago+")";
    }
  }else if(s.connected){ green();
    el.textContent="● LAST RUN OK · connected to IBKR · block: "+s.block+" · finished "+when+" ("+ago+")";
  }else{ red();
    el.textContent="⚠ LAST RUN FAILED TO CONNECT TO IBKR · "+when+" · block: "+s.block;
  }
}

function tabs(id, defs, cur, fn){
  const el=document.getElementById(id);
  el.innerHTML="";
  for(const [val,lab] of defs){
    const s=document.createElement("span");
    s.className="tb"+(val===cur?" sel":""); s.textContent=lab;
    s.onclick=()=>{ fn(val); refreshTabs(); draw(); renderTrades(); };
    el.appendChild(s);
  }
}
function refreshTabs(){
  tabs("symTabs",[["SPY","SPY"],["QQQ","QQQ"]],SYM,v=>SYM=v);
  tabs("tfTabs",TFS,TF,v=>TF=v);
  tabs("rgTabs",RGS,RANGE,v=>RANGE=v);
}

async function load(){
  for(const s of ["SPY","QQQ"]){
    try{
      const r=await fetch("data/proxies/"+s+".csv?t="+Date.now(),{cache:"no-store"});
      if(r.ok) BARS[s]=parseBars(await r.text());
    }catch(e){}
  }
  try{
    const r=await fetch("data/bot_journal.csv?t="+Date.now(),{cache:"no-store"});
    if(r.ok) ROWS=parseCSV(await r.text());
  }catch(e){}
  try{
    const r=await fetch("data/bot_status.json?t="+Date.now(),{cache:"no-store"});
    if(r.ok) STATUS=await r.json();
  }catch(e){}
  renderBotline(STATUS);
  draw(); renderTrades();
  document.getElementById("upd").textContent="checked "+new Date().toLocaleTimeString();
}

document.getElementById("chart").addEventListener("mousemove",ev=>{
  const tip=document.getElementById("tip");
  if(!VIEW.length){ tip.style.display="none"; return; }
  const rc=ev.currentTarget.getBoundingClientRect();
  const mx=ev.clientX-rc.left, my=ev.clientY-rc.top;
  for(const h of HIT){
    if(Math.abs(h.x-mx)<7 && Math.abs(h.y-my)<9){
      tip.style.display="block";
      tip.style.left=Math.min(mx+12, rc.width-190)+"px"; tip.style.top=(my-52)+"px";
      tip.innerHTML='<span class="t">'+h.r.date+' · '+h.r.window+'</span><br><b>'+
        (h.r.bias==="bull"?"LONG":"SHORT")+' '+(h.r.qty||"")+'</b> @ '+h.r.entry+
        (h.r.exit?' → '+h.r.exit:'')+'<br>'+h.r.outcome+
        (h.r.outcome!=="signal" ? ' · '+h.r.R.toFixed(2)+'R · '+(h.r.$<0?'-':'+')+'$'+Math.abs(h.r.$).toFixed(0) : '');
      return;
    }
  }
  let best=VIEW[0];
  for(const v of VIEW) if(Math.abs(v.x-mx)<Math.abs(best.x-mx)) best=v;
  const b=best.b;
  const tl=TF===1440 ? b.d : b.d+" "+String(Math.floor(b.m/60)).padStart(2,"0")+":"+String(b.m%60).padStart(2,"0")+" ET";
  tip.style.display="block";
  tip.style.left=Math.min(mx+12, rc.width-170)+"px"; tip.style.top=(my-58)+"px";
  tip.innerHTML='<span class="t">'+tl+'</span><br>O '+b.o.toFixed(2)+'  H '+b.h.toFixed(2)+
    '<br>L '+b.l.toFixed(2)+'  C <b>'+b.c.toFixed(2)+'</b>';
});
document.getElementById("chart").addEventListener("mouseleave",()=>{
  document.getElementById("tip").style.display="none";});
window.addEventListener("resize",()=>{ draw(); });

refreshTabs();
load();
setInterval(load, 60000);
</script>
</body>
</html>
